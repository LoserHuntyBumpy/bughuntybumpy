#cloud-config
# First-Boot vm-data: postgres, redis, minio. Nur svc-switch (kein Egress).
hostname: vm-data
manage_etc_hosts: true
users:
  - name: bhb
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_pubkey}
write_files:
  - path: /etc/netplan/60-bhb.yaml
    content: |
      network:
        version: 2
        ethernets:
          eth0: {addresses: [10.20.0.20/24]}   # postgres 5432, redis 6379, minio 9000
runcmd:
  - netplan apply
  - sed -i "s/^#listen_addresses.*/listen_addresses = '10.20.0.20'/" /etc/postgresql/15/main/postgresql.conf
  - sed -i 's/^bind .*/bind 10.20.0.20/' /etc/redis/redis.conf
  - systemctl restart postgresql redis-server
